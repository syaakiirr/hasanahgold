<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hasanah Gold brand film</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#130e0b}#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#130e0b}
#scene{position:absolute;inset:0;transform-origin:65% 64%}#scene img{width:100%;height:100%;object-fit:cover}
#light{position:absolute;inset:-40%;background:radial-gradient(ellipse at center,rgba(255,222,168,.17),transparent 55%);mix-blend-mode:screen;pointer-events:none}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="24">
 <div id="scene"><img src="keyframe.png" alt="Conceptual gold jewellery on dark satin"><div id="light"></div></div>
</div>
<script src="gsap.min.js"></script><script>
const tl=gsap.timeline({paused:true});
tl.set('#scene',{scale:1.035,x:-10,y:3},0)
  .to('#scene',{scale:1.095,x:12,y:-9,duration:4,ease:'sine.inOut'},0)
  .to('#scene',{scale:1.035,x:-10,y:3,duration:4,ease:'sine.inOut'},4)
  .set('#light',{x:-350,opacity:.22},0)
  .to('#light',{x:350,opacity:.75,duration:4,ease:'sine.inOut'},0)
  .to('#light',{x:-350,opacity:.22,duration:4,ease:'sine.inOut'},4);
window.__timelines={root:tl};
</script></body></html>
